<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>YoutubeKitの復旧</title>
    <style>
      body { max-width: 34rem; margin: 3rem auto; padding: 1.5rem; font-family: sans-serif; line-height: 1.8; color: #244b41; background: #f6f5f0; }
      button { padding: 1rem; border: 0; border-radius: .8rem; background: #244b41; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .6; }
    </style>
  </head>
  <body>
    <h1>YoutubeKitの復旧</h1>
    <p>Google接続後に画面が開かなくなる不具合の修正版を適用します。再生を終了してから押してください。キュー・非表示・設定・Google接続は削除しません。</p>
    <button id="apply" type="button">修正版を適用して開く</button>
    <p id="status" role="status"></p>
    <script type="module">
      const button = document.querySelector("#apply");
      const status = document.querySelector("#status");
      button.addEventListener("click", async () => {
        button.disabled = true;
        status.textContent = "修正版を確認しています…";
        let timeout;
        // 既存の保存領域やセッションを消さず、更新完了を待ってから画面を開く。
        try {
          if (!("serviceWorker" in navigator)) {
            location.replace("/");
            return;
          }
          const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/", updateViaCache: "none" });
          await reg.update();
          await Promise.race([
            (async () => {
              while (reg.installing) {
                const worker = reg.installing;
                await new Promise((resolve, reject) => {
                  const changed = () => {
                    if (worker.state === "redundant") { worker.removeEventListener("statechange", changed); reject(new Error("install")); }
                    else if (worker.state === "installed" || worker.state === "activated") { worker.removeEventListener("statechange", changed); resolve(); }
                  };
                  worker.addEventListener("statechange", changed);
                  changed();
                });
              }
              if (reg.waiting) {
                const worker = reg.waiting;
                await new Promise((resolve, reject) => {
                  const changed = () => {
                    if (worker.state === "activated") { worker.removeEventListener("statechange", changed); resolve(); }
                    else if (worker.state === "redundant") { worker.removeEventListener("statechange", changed); reject(new Error("activate")); }
                  };
                  worker.addEventListener("statechange", changed);
                  worker.postMessage({ type: "APPLY_UPDATE" });
                  changed();
                });
              }
            })(),
            new Promise((_, reject) => { timeout = setTimeout(() => reject(new Error("timeout")), 30000); }),
          ]);
          location.replace("/");
        } catch {
          status.textContent = "更新できませんでした。通信を確認して、もう一度押してください。";
          button.disabled = false;
        } finally {
          clearTimeout(timeout);
        }
      });
    </script>
  </body>
</html>
